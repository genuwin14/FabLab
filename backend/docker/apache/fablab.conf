# fablab-app's one site. Replaces the image's 000-default.conf.
#
# Only public/ is served. Laravel's routing comes from public/.htaccess,
# which AllowOverride lets Apache read. Uploads are reached through the
# public/storage link, which is why FollowSymLinks is on.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Both go to `docker logs` (the image links these files to stdout/stderr).
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
