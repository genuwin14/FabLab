; FabLab's PHP settings, loaded after php.ini-production.
; The same limits as the Hostinger guide (docs/Deployment.md, section 5.3).

; The sales and inventory reports (DOCX/PDF) need the memory and the time.
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; The materials report import takes files up to 10 MB.
upload_max_filesize = 16M
post_max_size = 20M

expose_php = Off

; The app keeps its clock in UTC (config/app.php), so PHP does too.
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Checks files for changes every 2 seconds, so a cache rebuilt by an artisan
; command takes effect without restarting Apache.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
